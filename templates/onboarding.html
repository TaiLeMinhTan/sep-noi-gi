{% extends 'base.html' %}{% block body %}
<main class="onboarding-view"><section class="onboarding-shell"><div class="onboarding-progress"><div style="width:100%"></div></div><div class="onboarding-card"><span class="step-no">PERSONALIZE YOUR ENGLISH</span><h1>What should your English<br>sound like at work?</h1><p>We use this profile later as AI context, so vocabulary and examples stay close to your life.</p><form method="post"><div class="option-grid"><label class="option-card"><strong>Age</strong><input name="age" type="number" min="10" max="100" placeholder="31" style="margin-top:10px;width:100%;padding:10px"></label><label class="option-card"><strong>Occupation</strong><input name="occupation" placeholder="Test Engineer" required style="margin-top:10px;width:100%;padding:10px"></label><label class="option-card"><strong>Industry</strong><input name="industry" placeholder="Optical / Manufacturing" style="margin-top:10px;width:100%;padding:10px"></label><label class="option-card"><strong>English level</strong><select name="english_level" style="margin-top:10px;width:100%;padding:10px"><option>Beginner</option><option selected>Intermediate</option><option>Upper-intermediate</option></select></label><label class="option-card"><strong>Situations</strong><textarea name="situations" placeholder="Meetings, troubleshooting, email" style="margin-top:10px;width:100%;padding:10px"></textarea></label><label class="option-card"><strong>Goal</strong><textarea name="goals" placeholder="Communicate naturally at work" style="margin-top:10px;width:100%;padding:10px"></textarea></label></div><input type="hidden" name="preferred_accent" value="en-US"><div class="onboarding-actions"><button class="primary">Start learning →</button></div></form></div></section></main>
{% endblock %}
