<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Sếp Nói Gì?</title><link rel="stylesheet" href="{{ url_for('static',filename='css/styles.css') }}"></head>
<body class="auth-body"><main class="auth-card admin-auth"><div class="brand-mark">S</div><p class="eyebrow">ADMIN CONSOLE</p><h1>Chi phí & vận hành</h1><p class="muted">Đăng nhập tài khoản quản trị để xem API cost, cache và usage.</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post" class="auth-form"><label>Email<input type="email" name="email" required autofocus></label><label>Password<input type="password" name="password" required></label><button class="primary-btn" type="submit">Login as admin</button></form><p class="tiny muted">Admin account được cấu hình trong file .env.</p></main></body></html>
